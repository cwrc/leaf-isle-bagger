name: OCI image registry cleanup actions

on:
  schedule:
    - cron: '39 23 * * 1'
  # manual
  workflow_dispatch:

env:

  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io

  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

permissions:
  packages: write


jobs:

  GHCR-io-cleanup-action:

    # https://github.com/marketplace/actions/ghcr-io-cleanup-action
    # https://github.com/dataaxiom/ghcr-cleanup-action?tab=readme-ov-file

    runs-on: ubuntu-latest
    steps:
      - name: Clean up old feature/branch tags
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Target all tags so age and exclusion rules apply
          delete-tags: '.*'
          # Exclude SemVer releases and 'latest' so Step 1 only touches branch/feature tags
          exclude-tags: '^latest$|^v?\d+\.\d+\.\d+$|^v?\d+\.\d+$|^v?\d+$'
          use-regex: true
          older-than: 7 days
          delete-untagged: true
          dry-run: false 

      - name: Retain only the x newest SemVer releases
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: '^v?\d+\.\d+\.\d+$|^v?\d+\.\d+$|^v?\d+$'
          use-regex: true
          keep-n-tagged: 5
          exclude-tags: '^latest$'
          delete-untagged: true

